<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="29 Card Game logo">
  <defs>
    <radialGradient id="felt" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1f7a4d"/>
      <stop offset="65%" stop-color="#145c39"/>
      <stop offset="100%" stop-color="#0a3822"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e2a0"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9c7a1e"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6da"/>
      <stop offset="100%" stop-color="#e8c766"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="222" fill="url(#felt)" stroke="#0a3822" stroke-width="2"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#f6e2a0" stroke-width="3" opacity="0.35"/>

  <g filter="url(#softShadow)">
    <text x="256" y="300" text-anchor="middle" font-family="'Georgia','Times New Roman',serif" font-weight="700" font-size="176" fill="url(#goldSoft)" stroke="#5c4413" stroke-width="3" paint-order="stroke">29</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="54" text-anchor="middle">
    <text x="256" y="120" fill="#101010">♠</text>
    <text x="256" y="430" fill="#c0392b">♦</text>
    <text x="108" y="275" fill="#c0392b">♥</text>
    <text x="404" y="275" fill="#101010">♣</text>
  </g>

  <circle cx="256" cy="256" r="248" fill="none" stroke="#5c4413" stroke-width="4" opacity="0.5"/>
</svg>
